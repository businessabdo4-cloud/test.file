<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url(fonts/Lalezar-Regular.ttf)}
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:TajB;src:url(fonts/Tajawal-Black.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#07070b}
#stage{position:absolute;inset:0;transform-origin:50% 45%}
.L{position:absolute;left:0;top:0}
.full{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar{font-family:Lalezar,Anton,sans-serif;direction:rtl}
.lat{font-family:Anton,Lalezar,sans-serif;letter-spacing:1px}
.ol{-webkit-text-stroke:9px #000;paint-order:stroke fill}
.c{display:flex;align-items:center;justify-content:center}
.card{position:absolute;width:420px;height:420px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:3px solid rgba(255,255,255,.18);box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .ic{font-size:150px;line-height:1}
.card .lb{font-family:Anton;font-size:58px;color:#fff;margin-top:18px;letter-spacing:2px}
.phone{position:absolute;width:640px;height:1160px;left:220px;top:190px;border-radius:84px;background:#0d0d12;box-shadow:0 0 0 14px #1d1d25,0 0 0 17px #3a3a48,0 40px 120px rgba(0,0,0,.7)}
.screen{position:absolute;inset:16px;border-radius:70px;overflow:hidden;background:#000}
.notch{position:absolute;top:28px;left:50%;width:170px;height:44px;margin-left:-85px;border-radius:30px;background:#000;z-index:5}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.rays{position:absolute;left:-760px;top:-340px;width:2600px;height:2600px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg)}
#subs{position:absolute;left:40px;right:40px;top:1300px;height:300px;display:flex;align-items:center;justify-content:center}
#subpage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;direction:rtl;gap:6px 22px;max-width:1000px;transform-origin:50% 50%}
.w{font-family:Lalezar,Anton,sans-serif;font-size:104px;line-height:1.25;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.5);padding:0 14px;border-radius:26px;display:inline-block}
.w.on{background:#FE2C55;-webkit-text-stroke:0;text-shadow:0 6px 0 #9e0f2c;box-shadow:0 10px 0 #9e0f2c,0 0 40px rgba(254,44,85,.55)}
#grain{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;background:url(assets/grain.png);background-size:540px 960px;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#prog{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#25F4EE,#FE2C55);box-shadow:0 0 18px #FE2C55}
.shard{position:absolute;inset:0;will-change:transform}
.wm{position:absolute;inset:-40%;transform:rotate(-28deg);display:flex;flex-direction:column;justify-content:center;gap:58px}
.wm div{font-family:Anton;font-size:64px;color:rgba(255,255,255,.55);white-space:nowrap;letter-spacing:4px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
</style></head>
<body><div id="root"><div id="stage"></div>
<div id="vig"></div><div id="grain"></div>
<div id="subs"><div id="subpage"></div></div>
<div id="prog"></div><div id="flash"></div></div>
<script>
// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=(x,s=1.9)=>{x=cl(x);return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eIn=x=>x*x*x;
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=(html,parent)=>{const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;(parent||stage).appendChild(e);return e};
const css=(e,o)=>{for(const k in o)e.style[k]=o[k]};
const tr=(e,x,y,s=1,r=0,sx)=>{e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s}${sx!==undefined?','+sx:''})`};
const stage=document.getElementById('stage');
const A='assets/';
const T=window.TIMING; const W=T.words; const DUR=window.DUR;
// ---------- scenes ----------
const scenes=[];
function scene(a,b,build,upd){const el=$('<div class="scene"></div>');const o={a,b,el};build(el,o);o.upd=upd.bind(null,o);scenes.push(o);return o}

// ===== HOOK 0 - 2.25 =====
scene(0,2.25,(el,o)=>{
  o.bg=$(`<img class="cover" src="${A}creator_hd.jpg">`,el);
  o.pro=$(`<div class="L lat" style="width:1080px;top:250px;text-align:center;font-size:520px;line-height:1;color:transparent;background:linear-gradient(180deg,#ffffff 20%,#25F4EE 60%,#FE2C55 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 40px rgba(37,244,238,.45))">PRO</div>`,el);
  o.cut=$(`<img class="cover" src="${A}creator_cut_hd.png">`,el);
  o.dark=$(`<div class="full" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.6) 100%)"></div>`,el);
  o.ban=$(`<div class="L" style="left:90px;top:110px;width:900px;height:150px;transform-origin:50% 50%">
     <div class="full" style="background:#B3122E;border-radius:22px;transform:skewX(-10deg);box-shadow:0 12px 0 #5c0715,0 0 50px rgba(254,44,85,.6)"></div>
     <div class="full c" style="gap:24px"><span class="lat" style="font-size:84px;color:#fff;font-style:italic">CapCut PRO</span><span class="ar" style="font-size:78px;color:#FFE600;margin-top:10px">غير بـ 45 درهم 🔥</span></div></div>`,el);
  o.chips=[['🚫 WATERMARK','#ff3b5c'],['🔓 PRO','#25F4EE'],['⚡ 4K','#FFE600']].map((c,i)=>$(`<div class="pill lat" style="top:1080px;left:${[70,420,700][i]}px;height:100px;padding:0 34px;font-size:52px;background:rgba(10,10,16,.82);color:${c[1]};border:3px solid ${c[1]};box-shadow:0 0 30px ${c[1]}55">${c[0]}</div>`,el));
},(o,t)=>{
  const z=lerp(1.18,1.06,eOut(P(t,0,2.25)));
  [o.bg,o.cut].forEach(e=>tr(e,0,lerp(-40,0,eOut(P(t,0,2.25))),z));
  o.bg.style.filter=`brightness(${lerp(.7,.88,P(t,0,.5))}) saturate(1.25)`;
  const pp=eBack(P(t,0,.4),2.2); o.pro.style.opacity=1;
  tr(o.pro,0,lerp(140,0,eOut(P(t,0,.4))),lerp(.62,1,pp)*z*(1+.03*Math.sin(t*9)));
  const bp=eBack(P(t,.12,.45)); o.ban.style.opacity=P(t,.12,.18); tr(o.ban,lerp(700,0,eExpo(P(t,.12,.42))),0,lerp(.6,1,bp)*(1+.025*Math.sin(t*12)),-3);
  o.chips.forEach((c,i)=>{const a=.8+i*.18;c.style.opacity=P(t,a,a+.06);tr(c,0,0,eBack(P(t,a,a+.3),2.5))});
});

// ===== PROBLEM 2.25 - 4.878 =====
scene(2.25,4.878,(el,o)=>{
  $(`<div class="full" style="background:radial-gradient(circle at 50% 40%,#2a0b12 0%,#0a0508 70%)"></div>`,el);
  o.grid=$(`<div class="L" style="left:-200px;top:-200px;width:1480px;height:2400px;opacity:.18;background-image:linear-gradient(rgba(255,60,90,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,60,90,.6) 2px,transparent 2px);background-size:90px 90px"></div>`,el);
  o.lab=$(`<div class="L lat" style="width:1080px;top:70px;text-align:center;font-size:76px;color:#bbb;letter-spacing:6px">FREE VERSION 😩</div>`,el);
  o.ph=$(`<div class="phone"><div class="screen"></div><div class="notch"></div></div>`,el);
  o.scr=o.ph.querySelector('.screen');
  const content=()=>`<img class="cover" src="${A}souk_hd.jpg" style="filter:saturate(.75) brightness(.85)"><div class="wm">${Array(12).fill(0).map((_,i)=>`<div>${i%2?'&nbsp;&nbsp;&nbsp;&nbsp;':''}WATERMARK • WATERMARK • WATERMARK • WATERMARK</div>`).join('')}</div>
     <div class="full c" style="flex-direction:column"><div class="lat" style="font-size:96px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:6px 30px;border-radius:18px;border:4px dashed rgba(255,255,255,.7)">WATERMARK</div></div>`;
  o.intact=$(`<div class="full">${content()}</div>`,o.scr);
  o.wmLayer=[...o.intact.querySelectorAll('.wm,.full.c')];
  // shards (triangles over a jittered 3x4 grid)
  const R=rng(7),cols=3,rows=4,Wd=608,Ht=1128,pts=[];
  for(let j=0;j<=rows;j++){pts[j]=[];for(let i=0;i<=cols;i++){const ex=(i==0||i==cols),ey=(j==0||j==rows);pts[j][i]=[i*Wd/cols+(ex?0:(R()-.5)*120),j*Ht/rows+(ey?0:(R()-.5)*140)]}}
  o.shards=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i+1],d=pts[j+1][i];
    for(const tri of [[a,b,c],[a,c,d]]){
      const s=$(`<div class="shard" style="clip-path:polygon(${tri.map(p=>p[0]+'px '+p[1]+'px').join(',')});visibility:hidden">${content()}</div>`,o.scr);
      const cx=(tri[0][0]+tri[1][0]+tri[2][0])/3-Wd/2, cy=(tri[0][1]+tri[1][1]+tri[2][1])/3-Ht/2;
      s.style.transformOrigin=`${cx+Wd/2}px ${cy+Ht/2}px`;
      o.shards.push({s,vx:cx*2.6+(R()-.5)*500,vy:cy*1.6-300+(R()-.5)*500,vr:(R()-.5)*260});
    }}
  o.crack=$(`<svg class="full" viewBox="0 0 608 1128" style="visibility:hidden"><g stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 8px #fff)">
     <path d="M300 560 L120 300 L40 120 M300 560 L520 260 L600 160 M300 560 L80 800 L10 1000 M300 560 L540 860 L590 1100 M300 560 L330 40 M300 560 L260 1120 M120 300 L0 380 M520 260 L608 330 M80 800 L0 740 M540 860 L608 800"/></g></svg>`,o.scr);
  o.tiles=[['✨','EFFECTS'],['🤖','AI'],['🎬','4K'],['📐','TEMPLATES']].map((x,i)=>$(`<div class="L c" style="left:${120+i*215}px;top:1110px;width:195px;height:195px;border-radius:34px;background:rgba(30,30,40,.92);border:3px solid rgba(255,255,255,.15);flex-direction:column">
    <div style="font-size:70px;filter:grayscale(1) brightness(.6)">${x[0]}</div><div class="lat" style="font-size:30px;color:#777">${x[1]}</div>
    <div class="L c" style="left:118px;top:-30px;width:96px;height:96px;border-radius:50%;background:#ff2d55;font-size:52px;box-shadow:0 0 25px #ff2d55">🔒</div></div>`,el));
  o.redv=$(`<div class="full" style="background:radial-gradient(ellipse at 50% 50%,rgba(255,0,40,0) 45%,rgba(255,0,40,.55) 100%);opacity:0"></div>`,el);
},(o,t)=>{
  tr(o.grid,0,(t*120)%90);
  o.lab.style.opacity=P(t,2.3,2.45);
  const ent=eExpo(P(t,2.25,2.6)); const shake=Math.pow(P(t,3.4,4.87),2)*14;
  const sx=Math.sin(t*93)*shake, sy=Math.cos(t*71)*shake;
  tr(o.ph,sx,lerp(900,0,ent)+sy,lerp(.85,1,ent));
  // watermark glitch-in at 2.85
  const g=P(t,2.85,2.95); const gl=(t>2.85&&t<3.15)?(Math.sin(t*240)>0?1:0):0;
  o.wmLayer.forEach(e=>{e.style.opacity=g;e.style.transform=gl?`translateX(${Math.sin(t*500)*30}px)`:'';e.style.filter=gl?'drop-shadow(8px 0 0 #ff004c) drop-shadow(-8px 0 0 #00f0ff)':'none'});
  o.tiles.forEach((e,i)=>{const a=3.48+i*.12;e.style.opacity=P(t,a,a+.05);const lk=t>4.09?Math.sin((t-4.09)*60)*8*Math.max(0,1-(t-4.09)*2.4):0;tr(e,lk,0,eBack(P(t,a,a+.28),2.3)*(1+(t>4.09?.05*Math.max(0,1-(t-4.09)*4):0)))});
  o.redv.style.opacity=(t>4.09?.25+.35*P(t,3.6,4.87):0)*(.75+.25*Math.sin(t*30));
  o.intact.style.visibility='visible'; o.shards.forEach(s=>s.s.style.visibility='hidden'); o.crack.style.visibility='hidden';
});

// ===== UNLOCK + BRAND 4.878 - 6.75 =====
scene(4.878,6.75,(el,o)=>{
  o.bgc=$(`<div class="full" style="background:radial-gradient(circle at 50% 42%,#ff2d6f 0%,#7a0f3d 32%,#12061a 70%)"></div>`,el);
  o.rays=$(`<div class="rays"></div>`,el);
  o.sw1=$(`<img class="L" src="${A}swoosh_tl.png" style="width:560px;left:0;top:0">`,el);
  o.sw2=$(`<img class="L" src="${A}swoosh_br.png" style="width:520px;left:560px;top:1300px">`,el);
  o.cap=$(`<div class="L c" style="width:1080px;top:470px;height:300px;flex-direction:column">
     <div class="lat" style="font-size:190px;color:#fff;line-height:1;text-shadow:7px 0 0 #FE2C55,-7px 0 0 #25F4EE,0 18px 40px rgba(0,0,0,.5)">CapCut</div>
     <div class="lat c" style="margin-top:14px;font-size:120px;color:#1a1100;background:linear-gradient(180deg,#fff3a0,#ffc400 55%,#ff9d00);padding:4px 54px;border-radius:24px;box-shadow:0 10px 0 #a45f00,0 0 60px rgba(255,200,0,.7)">PRO 👑</div></div>`,el);
  o.logo=$(`<div class="L" style="left:90px;top:860px;width:900px;height:366px"><img src="${A}logo_main.png" style="width:900px"><div class="full" style="overflow:hidden;-webkit-mask:url(${A}logo_main.png) 0 0/900px auto no-repeat"><div class="shine L" style="top:-100px;width:160px;height:600px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:rotate(20deg)"></div></div></div>`,el);
  o.shine=o.logo.querySelector('.shine');
  o.shop=$(`<div class="L lat" style="width:1080px;top:1225px;text-align:center;font-size:70px;color:#fff;letter-spacing:22px">SHOP</div>`,el);
  o.parts=[];const R=rng(3);
  for(let i=0;i<26;i++){o.parts.push({e:$(`<div class="L" style="width:${10+R()*16}px;height:${10+R()*16}px;border-radius:${R()>.5?'50%':'3px'};background:${['#FFE600','#25F4EE','#FE2C55','#fff'][i%4]}"></div>`,el),a:R()*Math.PI*2,v:500+R()*900,r:R()*400})}
},(o,t)=>{
  const k=t-4.878;
  tr(o.rays,0,0,1,t*25); o.rays.style.opacity=.9;
  const s=eExpo(P(k,0,.28)); tr(o.cap,0,lerp(0,-240,eInOut(P(k,.6,.9))),lerp(2.6,1,s)*lerp(1,.78,eInOut(P(k,.6,.9))),lerp(-8,0,s));
  o.cap.style.opacity=P(k,0,.05); o.cap.style.filter=`blur(${lerp(14,0,P(k,0,.18))}px)`;
  o.parts.forEach(p=>{const d=eOut(P(k,0,.9));p.e.style.opacity=1-P(k,.5,.9);tr(p.e,540+Math.cos(p.a)*p.v*d,640+Math.sin(p.a)*p.v*d+300*d*d,1,p.r*d)});
  const lg=P(k,.61,1.0); o.logo.style.opacity=P(k,.61,.66);
  tr(o.logo,0,lerp(-60,-110,eInOut(P(k,.6,.9))),lerp(.25,1,eBack(lg,2.0))*(1+.04*Math.max(0,1-(k-1.06)*5)*(k>1.04?1:0)));
  css(o.shine,{left:lerp(-300,1100,P(k,1.0,1.5))+'px'});
  o.shop.style.opacity=P(k,1.05,1.15); tr(o.shop,0,-110,1,0); o.shop.style.letterSpacing=lerp(60,22,eOut(P(k,1.05,1.4)))+'px';
  tr(o.sw1,lerp(-560,0,eExpo(P(k,.6,1.0))),lerp(-300,0,eExpo(P(k,.6,1.0))));
  tr(o.sw2,lerp(560,0,eExpo(P(k,.6,1.0))),lerp(400,0,eExpo(P(k,.6,1.0))));
});

// ===== ALL UNLOCKED 6.75 - 7.68 =====
scene(6.75,7.68,(el,o)=>{
  $(`<div class="full" style="background:radial-gradient(circle at 50% 45%,#10233a 0%,#06070d 70%)"></div>`,el);
  o.ttl=$(`<div class="L lat" style="width:1080px;top:150px;text-align:center;font-size:120px;color:#FFE600;text-shadow:0 0 40px rgba(255,230,0,.6)">UNLOCKED 🔓</div>`,el);
  const items=[['✨','EFFECTS'],['📐','TEMPLATES'],['🤖','AI TOOLS'],['🎬','4K']];
  o.cards=items.map((x,i)=>{const c=$(`<div class="card" style="left:${i%2?560:100}px;top:${i<2?370:830}px"><div class="ic">${x[0]}</div><div class="lb">${x[1]}</div>
     <div class="lk L c" style="left:300px;top:-34px;width:130px;height:130px;border-radius:50%;background:#ff2d55;font-size:70px">🔒</div>
     <div class="ok L c" style="left:300px;top:-34px;width:130px;height:130px;border-radius:50%;background:#19d26b;font-size:80px;color:#fff;font-family:Anton;box-shadow:0 0 40px #19d26b">✓</div></div>`,el);
     return {c,lk:c.querySelector('.lk'),ok:c.querySelector('.ok')}});
},(o,t)=>{
  o.ttl.style.opacity=P(t,6.78,6.86); tr(o.ttl,0,0,eBack(P(t,6.78,7.05),2.4));
  const un=[7.06,7.24,7.42,7.57];
  o.cards.forEach((c,i)=>{const a=6.78+i*.05;c.c.style.opacity=P(t,a,a+.06);tr(c.c,0,lerp(120,0,eExpo(P(t,a,a+.3))),1);
    const u=un[i];c.lk.style.opacity=1-P(t,u,u+.08);tr(c.lk,0,lerp(0,-80,eOut(P(t,u,u+.2))),1+P(t,u,u+.1),lerp(0,40,P(t,u,u+.2)));
    c.ok.style.opacity=P(t,u,u+.04);tr(c.ok,0,0,eBack(P(t,u,u+.25),3));
    c.c.style.borderColor=t>u?'#19d26b':'rgba(255,255,255,.18)';c.c.style.boxShadow=t>u?'0 0 50px rgba(25,210,107,.45),0 30px 60px rgba(0,0,0,.5)':'0 30px 60px rgba(0,0,0,.5)';
    c.c.querySelector('.ic').style.filter=t>u?'none':'grayscale(1) brightness(.55)';});
});

// ===== EFFECTS 7.68 - 8.50 =====
scene(7.68,8.50,(el,o)=>{
  o.img=$(`<img class="cover" src="${A}creator_hd.jpg">`,el);
  o.r=$(`<img class="cover" src="${A}creator_hd.jpg" style="mix-blend-mode:screen">`,el);
  o.leak=$(`<div class="full" style="background:radial-gradient(circle at 20% 20%,rgba(255,120,0,.55),transparent 45%),radial-gradient(circle at 85% 70%,rgba(255,0,140,.5),transparent 50%);mix-blend-mode:screen"></div>`,el);
  o.lab=$(`<div class="pill lat" style="left:80px;top:180px;height:140px;padding:0 50px;font-size:92px;background:#FFE600;color:#111;box-shadow:0 12px 0 #9c8a00">✨ EFFECTS</div>`,el);
  o.sp=[];const R=rng(11);for(let i=0;i<14;i++)o.sp.push({e:$(`<div class="L" style="font-size:${50+R()*60}px">✨</div>`,el),x:R()*980,y:200+R()*1100,d:R()*.6});
},(o,t)=>{
  const k=t-7.68; const ph=Math.floor(k/.27);
  const z=lerp(1.05,1.25,eOut(P(k,0,.82)));
  tr(o.img,0,0,z);tr(o.r,0,0,z*1.03);
  const f=[`hue-rotate(${k*700}deg) saturate(2)`,`contrast(1.4) saturate(1.6) sepia(.25)`,`saturate(1.8) brightness(1.15)`][ph%3];
  o.img.style.filter=f;
  o.r.style.opacity=ph==1?.5:0; o.r.style.transform=`translate(${Math.sin(k*90)*24}px,0) scale(${z*1.03})`;
