<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url(fonts/Lalezar-Regular.ttf)}
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:TajB;src:url(fonts/Tajawal-Black.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#07070b}
#stage{position:absolute;inset:0;transform-origin:50% 45%}
.L{position:absolute;left:0;top:0}
.full{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar{font-family:Lalezar,Anton,sans-serif;direction:rtl}
.lat{font-family:Anton,Lalezar,sans-serif;letter-spacing:1px}
.taj{font-family:TajB,Anton,sans-serif}
.ol{-webkit-text-stroke:9px #000;paint-order:stroke fill}
.c{display:flex;align-items:center;justify-content:center}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.rays{position:absolute;left:-760px;top:-340px;width:2600px;height:2600px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg)}
.phone{position:absolute;width:640px;height:1160px;left:220px;top:150px;border-radius:84px;background:#0d0d12;box-shadow:0 0 0 14px #1d1d25,0 0 0 17px #3a3a48,0 40px 120px rgba(0,0,0,.7)}
.screen{position:absolute;inset:16px;border-radius:70px;overflow:hidden;background:#000}
.notch{position:absolute;top:28px;left:50%;width:170px;height:44px;margin-left:-85px;border-radius:30px;background:#000;z-index:5}
/* app icons (stylised, no official artwork) */
.app{position:absolute;width:220px;height:220px;border-radius:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.12)}
.app.nf{background:#000}
.app.nf span{font-family:Anton;font-size:170px;color:#E50914;line-height:1;transform:scaleX(.82);text-shadow:0 6px 14px rgba(229,9,20,.45)}
.app.sp{background:#121212}
.app.sh{background:linear-gradient(140deg,#00d7a0,#00a6c8 55%,#5b2bd9)}
.app.sh span{font-family:Lalezar;font-size:96px;color:#fff;margin-top:14px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.tag{position:absolute;padding:0 22px;height:64px;border-radius:20px;font-family:Anton;font-size:40px;color:#fff;display:flex;align-items:center;white-space:nowrap}
#subs{position:absolute;left:40px;right:40px;top:1320px;height:300px;display:flex;align-items:center;justify-content:center}
#subpage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;direction:rtl;gap:6px 22px;max-width:1000px;transform-origin:50% 50%}
.w{font-family:Lalezar,Anton,sans-serif;font-size:104px;line-height:1.25;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.5);padding:0 14px;border-radius:26px;display:inline-block}
.w.on{background:#FE2C55;-webkit-text-stroke:0;text-shadow:0 6px 0 #9e0f2c;box-shadow:0 10px 0 #9e0f2c,0 0 40px rgba(254,44,85,.55)}
#grain{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;background:url(assets/grain.png);background-size:540px 960px;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#prog{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#1DB954,#E50914 50%,#00b3c8);box-shadow:0 0 18px #E50914}
</style></head>
<body><div id="root"><div id="stage"></div>
<div id="vig"></div><div id="grain"></div>
<div id="subs"><div id="subpage"></div></div>
<div id="prog"></div><div id="flash"></div></div>
<script>
// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=(x,s=1.9)=>{x=cl(x);return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=(html,parent)=>{const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;(parent||stage).appendChild(e);return e};
const css=(e,o)=>{for(const k in o)e.style[k]=o[k]};
const tr=(e,x,y,s=1,r=0)=>{e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`};
const pop=(e,t,a,d=.28,s=2.4)=>{e.style.opacity=P(t,a,a+.04);return eBack(P(t,a,a+d),s)};
const stage=document.getElementById('stage');
const A='assets/';
const T=window.TIMING; const W=T.words; const DUR=window.DUR;
const ws=i=>W[i].s;            // word start (output seconds)
const SG=T.segs.map(s=>s[0]-0.04); // scene cut points: just before each VO line
const spotIcon=(sz=150)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1DB954"/><g fill="none" stroke="#000" stroke-linecap="round"><path d="M24 38 Q52 28 78 42" stroke-width="8"/><path d="M28 54 Q52 46 73 57" stroke-width="7"/><path d="M31 68 Q50 62 68 71" stroke-width="6"/></g></svg>`;
const appHTML=(k,extra='')=>k=='nf'?`<div class="app nf" ${extra}><span>N</span></div>`:k=='sp'?`<div class="app sp" ${extra}>${spotIcon(150)}</div>`:`<div class="app sh" ${extra}><span>شاهد</span></div>`;
// ---------- scenes ----------
const scenes=[];
function scene(a,b,build,upd){const el=$('<div class="scene"></div>');const o={a,b,el};build(el,o);o.upd=upd.bind(null,o);scenes.push(o);return o}

// ===== 0 HOOK: "شحال كتخلص في Netflix و Spotify و شاهد كل واحد بوحدو؟" =====
scene(0,SG[1],(el,o)=>{
  o.bg=$(`<img class="cover" src="${A}creator_hd.jpg">`,el);
  o.big=$(`<div class="L ar" style="width:1080px;top:230px;text-align:center;font-size:300px;line-height:1.1;color:transparent;background:linear-gradient(180deg,#fff 15%,#ff4d6d 60%,#b3001b 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 40px rgba(255,40,80,.55))">شحال؟</div>`,el);
  o.cut=$(`<img class="cover" src="${A}creator_cut_hd.png">`,el);
  o.dark=$(`<div class="full" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.1) 50%,rgba(0,0,0,.75) 100%)"></div>`,el);
  o.ban=$(`<div class="L" style="left:70px;top:90px;width:940px;height:150px">
     <div class="full" style="background:#B3122E;border-radius:22px;transform:skewX(-10deg);box-shadow:0 12px 0 #5c0715,0 0 50px rgba(254,44,85,.6)"></div>
     <div class="full c" style="gap:22px;direction:rtl"><span class="ar" style="font-size:80px;color:#fff;margin-top:10px">3 فـ 1</span><span class="lat" style="font-size:60px;color:#fff">•</span><span class="ar" style="font-size:80px;color:#FFE600;margin-top:10px">غير بـ 70 درهم 🔥</span></div></div>`,el);
  o.apps=['nf','sp','sh'].map((k,i)=>$(appHTML(k,`style="left:${70+i*330}px;top:1010px"`),el));
  o.x=[0,1].map(i=>$(`<div class="L c lat" style="left:${300+i*330}px;top:1060px;width:90px;height:120px;font-size:110px;color:#ff2d55;text-shadow:0 0 30px #ff2d55">+</div>`,el));
  o.bill=$(`<div class="pill" style="left:200px;top:880px;width:680px;height:110px;background:rgba(15,0,5,.85);border:4px solid #ff2d55;box-shadow:0 0 40px rgba(255,45,85,.55);gap:20px;direction:rtl"><span class="ar" style="font-size:62px;color:#fff;margin-top:8px">💳 كل شهر:</span><span class="num lat" style="font-size:72px;color:#ff2d55;direction:ltr">000 DH</span></div>`,el);
  o.num=o.bill.querySelector('.num');
  o.redv=$(`<div class="full" style="background:radial-gradient(ellipse at 50% 50%,rgba(255,0,40,0) 45%,rgba(255,0,40,.6) 100%);opacity:0"></div>`,el);
},(o,t)=>{
  const end=SG[1];const z=lerp(1.16,1.04,eOut(P(t,0,end)));
  [o.bg,o.cut].forEach(e=>tr(e,0,lerp(-40,30,eOut(P(t,0,end))),z));
  o.bg.style.filter=`brightness(${lerp(.6,.8,P(t,0,.5))}) saturate(1.2)`;
  o.big.style.opacity=1;tr(o.big,0,lerp(160,0,eOut(P(t,0,.35))),lerp(.55,1,eBack(P(t,0,.4),2.2))*z*(1+.03*Math.sin(t*9)));
  o.ban.style.opacity=P(t,.1,.16);tr(o.ban,lerp(800,0,eExpo(P(t,.1,.42))),0,eBack(P(t,.1,.45))*(1+.025*Math.sin(t*12)),-3);
  const at=[ws(3),ws(5),ws(7)]; const split=P(t,ws(8),ws(8)+.2);
  o.apps.forEach((e,i)=>{const s=pop(e,t,at[i]-.05,.3,2.6);const dx=(i-1)*70*eOut(split);const sh=t>ws(8)?Math.sin(t*70+i)*8*(1-P(t,ws(8)+.3,ws(10)+.4)):0;tr(e,dx+sh,0,s*(1-.06*split),(i-1)*8*split)});
  o.x.forEach((e,i)=>{const a=at[i+1]-.08;e.style.opacity=P(t,a,a+.05)*(1-split);tr(e,0,0,eBack(P(t,a,a+.2),3))});
  // monthly bill counter rolls up with each app, then spins to ??? on "كل واحد بوحدو"
  o.bill.style.opacity=P(t,at[0],at[0]+.06);tr(o.bill,0,lerp(-60,0,eOut(P(t,at[0],at[0]+.25))),1+(t>ws(8)?.05*Math.sin(t*40)*(1-P(t,ws(8),ws(10)+.3)):0));
  const R=rng(Math.floor(t*24));o.num.textContent=t<ws(8)?String(100+Math.floor(R()*900))+' DH':(Math.floor(t*20)%2?'??? DH':'💸💸💸');
  o.redv.style.opacity=t>ws(8)?(.35+.3*P(t,ws(8),ws(10)))*(.75+.25*Math.sin(t*30)):0;
});

// ===== 1 SOLUTION (beat drop): "عندنا ليك الحل" =====
scene(SG[1],SG[2],(el,o)=>{
  $(`<div class="full" style="background:radial-gradient(circle at 50% 42%,#ffde4d 0%,#ff7a00 28%,#8a1a5c 62%,#1a0624 100%)"></div>`,el);
  o.rays=$(`<div class="rays" style="background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg)"></div>`,el);
  o.chk=$(`<div class="L c" style="left:290px;top:300px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4dff9a,#12b85a 70%);box-shadow:0 0 0 22px rgba(255,255,255,.25),0 0 120px rgba(40,255,140,.85)"><svg width="300" height="300" viewBox="0 0 100 100"><path d="M22 54 L42 72 L80 30" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/></svg></div>`,el);
  o.path=o.chk.querySelector('path');
  o.txt=$(`<div class="L ar ol" style="width:1080px;top:860px;text-align:center;font-size:190px;color:#fff;text-shadow:0 14px 0 rgba(0,0,0,.35)">عندنا الحل</div>`,el);
  o.parts=[];const R=rng(3);
  for(let i=0;i<30;i++)o.parts.push({e:$(`<div class="L" style="width:${12+R()*18}px;height:${12+R()*18}px;border-radius:${R()>.5?'50%':'4px'};background:${['#FFE600','#1DB954','#E50914','#fff','#00c2d8'][i%5]}"></div>`,el),a:R()*Math.PI*2,v:500+R()*900,r:R()*400});
},(o,t)=>{
  const k=t-SG[1];
  tr(o.rays,0,0,1,t*30);
  o.chk.style.opacity=P(k,0,.04);tr(o.chk,0,0,lerp(2.4,1,eExpo(P(k,0,.3)))*(1+.03*Math.sin(t*12)),lerp(-25,0,eExpo(P(k,0,.3))));
  o.path.style.strokeDashoffset=lerp(100,0,eOut(P(k,.12,.42)));
  o.txt.style.opacity=P(t,ws(13)-.05,ws(13));tr(o.txt,0,0,eBack(P(t,ws(13)-.05,ws(13)+.2),2.6));
  o.parts.forEach(p=>{const d=eOut(P(k,0,.9));p.e.style.opacity=1-P(k,.5,.9);tr(p.e,540+Math.cos(p.a)*p.v*d,550+Math.sin(p.a)*p.v*d+300*d*d,1,p.r*d)});
});

// ===== 2 PACK REVEAL: "Le Pack Streaming من عند Hochi Shop" =====
scene(SG[2],SG[3],(el,o)=>{
  $(`<div class="full" style="background:radial-gradient(circle at 50% 38%,#3a1366 0%,#14072b 45%,#05030b 80%)"></div>`,el);
  o.rays=$(`<div class="rays" style="opacity:.7"></div>`,el);
  o.sw1=$(`<img class="L" src="${A}swoosh_tl.png" style="width:520px;left:0;top:0">`,el);
  o.sw2=$(`<img class="L" src="${A}swoosh_br.png" style="width:480px;left:600px;top:1440px">`,el);
  o.le=$(`<div class="L lat" style="width:1080px;top:70px;text-align:center;font-size:90px;color:#FFE600;letter-spacing:12px">LE</div>`,el);
  o.pack=$(`<div class="L lat" style="width:1080px;top:190px;text-align:center;font-size:250px;line-height:1;color:#fff;text-shadow:8px 0 0 #E50914,-8px 0 0 #1DB954,0 18px 40px rgba(0,0,0,.5)">PACK</div>`,el);
  o.str=$(`<div class="L c" style="left:110px;top:445px;width:860px;height:150px"><div class="full" style="background:linear-gradient(90deg,#1DB954,#00b3c8 50%,#E50914);border-radius:26px;transform:skewX(-10deg);box-shadow:0 12px 0 rgba(0,0,0,.45),0 0 60px rgba(0,179,200,.5)"></div><span class="lat" style="position:relative;font-size:118px;color:#fff;letter-spacing:6px;text-shadow:0 6px 0 rgba(0,0,0,.3)">STREAMING</span></div>`,el);
  o.apps=['nf','sp','sh'].map((k,i)=>$(appHTML(k,`style="left:${95+i*330}px;top:680px"`),el));
  o.logo=$(`<div class="L" style="left:190px;top:960px;width:700px;height:284px"><img src="${A}logo_main.png" style="width:700px"><div class="full" style="overflow:hidden;-webkit-mask:url(${A}logo_main.png) 0 0/700px auto no-repeat"><div class="shine L" style="top:-100px;width:150px;height:500px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:rotate(20deg)"></div></div></div>`,el);
  o.shine=o.logo.querySelector('.shine');
},(o,t)=>{
  const k=t-SG[2];tr(o.rays,0,0,1,t*20);
  o.le.style.opacity=P(t,ws(14)-.05,ws(14));tr(o.le,0,0,1);o.le.style.letterSpacing=lerp(60,12,eOut(P(t,ws(14),ws(14)+.3)))+'px';
  o.pack.style.opacity=P(t,ws(15)-.05,ws(15));tr(o.pack,0,0,lerp(2.6,1,eExpo(P(t,ws(15)-.05,ws(15)+.2))));o.pack.style.filter=`blur(${lerp(12,0,P(t,ws(15)-.05,ws(15)+.12))}px)`;
  o.str.style.opacity=P(t,ws(16)-.05,ws(16));tr(o.str,lerp(-1100,0,eExpo(P(t,ws(16)-.05,ws(16)+.3))),0,1,0);
  o.apps.forEach((e,i)=>{const a=ws(17)-.1+i*.08;tr(e,0,lerp(300,0,eExpo(P(t,a,a+.3)))+Math.sin(t*4+i*2)*10,pop(e,t,a,.3,2.4))});
  const lg=ws(19)-.08;o.logo.style.opacity=P(t,lg,lg+.05);tr(o.logo,0,0,lerp(.3,1,eBack(P(t,lg,lg+.35),2)));
  css(o.shine,{left:lerp(-300,1000,P(t,lg+.35,lg+.85))+'px'});
  tr(o.sw1,lerp(-520,0,eExpo(P(t,lg,lg+.4))),lerp(-300,0,eExpo(P(t,lg,lg+.4))));tr(o.sw2,lerp(480,0,eExpo(P(t,lg,lg+.4))),lerp(400,0,eExpo(P(t,lg,lg+.4))));
});

// ===== 3 SPOTIFY: "Spotify للموسيقى بلا حدود" =====
scene(SG[3],SG[4],(el,o)=>{
  $(`<div class="full" style="background:radial-gradient(circle at 50% 35%,#1f7a45 0%,#0b2a18 45%,#040a06 85%)"></div>`,el);
  o.notes=[];const R=rng(9);for(let i=0;i<14;i++)o.notes.push({e:$(`<div class="L" style="font-size:${60+R()*60}px;color:#1DB954">${['♪','♫','🎵','🎧'][i%4]}</div>`,el),x:R()*980,d:R()*1.6,sp:180+R()*220});
  o.brand=$(`<div class="L c" style="left:0;top:110px;width:1080px;height:200px;gap:30px">${spotIcon(170)}<span class="taj" style="font-size:150px;color:#fff;letter-spacing:-3px">Spotify</span></div>`,el);
  o.card=$(`<div class="L" style="left:150px;top:360px;width:780px;height:880px;border-radius:50px;background:linear-gradient(180deg,#2b2b2b,#141414);box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.08)">
    <div class="art L c" style="left:90px;top:60px;width:600px;height:440px;border-radius:30px;background:linear-gradient(135deg,#1DB954,#0d6b8a 55%,#3a1366);overflow:hidden"><div class="L c" style="width:600px;height:440px;font-size:220px">🎧</div><div class="eq L c" style="left:0;top:330px;width:600px;height:100px;gap:9px;align-items:flex-end"></div></div>
    <div class="L taj" style="left:90px;top:530px;font-size:56px;color:#fff">Hochi Mix 🔥</div><div class="L taj" style="left:90px;top:600px;font-size:38px;color:#9a9a9a">Top hits • Rai • Rap • Pop</div>
    <div class="L" style="left:90px;top:680px;width:600px;height:12px;border-radius:6px;background:#4a4a4a"><div class="bar" style="height:100%;width:0;border-radius:6px;background:#1DB954"></div></div>
    <div class="L c" style="left:90px;top:715px;width:600px;height:130px;gap:90px"><span style="font-size:60px;color:#fff">⏮</span><div class="L c" style="position:relative;width:130px;height:130px;border-radius:50%;background:#1DB954"><svg width="54" height="60" viewBox="0 0 10 12"><rect x="1" y="0" width="3" height="12" fill="#000"/><rect x="6" y="0" width="3" height="12" fill="#000"/></svg></div><span style="font-size:60px;color:#fff">⏭</span></div></div>`,el);
  o.bars=[];const eq=o.card.querySelector('.eq');for(let i=0;i<26;i++)o.bars.push($(`<div style="width:14px;border-radius:7px;background:rgba(255,255,255,.85)"></div>`,eq));
  o.bar=o.card.querySelector('.bar');
  o.inf=$(`<div class="L c" style="left:240px;top:520px;width:600px;height:330px;border-radius:60px;background:#1DB954;box-shadow:0 16px 0 #0d7a37,0 0 90px rgba(29,185,84,.8);flex-direction:column"><div class="lat" style="font-size:250px;line-height:.9;color:#000;margin-top:-20px">∞</div><div class="lat" style="font-size:60px;color:#000;letter-spacing:8px;margin-top:-10px">UNLIMITED</div></div>`,el);
},(o,t)=>{
  const k=t-SG[3];
  o.brand.style.opacity=P(k,0,.05);tr(o.brand,0,lerp(-200,0,eExpo(P(k,0,.3))),1);
  tr(o.card,0,lerp(900,0,eExpo(P(k,.05,.4))),1,lerp(4,0,eExpo(P(k,.05,.4))));
  o.bars.forEach((b,i)=>{b.style.height=(14+80*Math.abs(Math.sin(i*1.3+t*11)*Math.sin(i*.5+t*5)))+'px'});
  o.bar.style.width=(lerp(8,92,P(k,0,1.9)))+'%';
  o.notes.forEach(n=>{const kk=k-n.d*.4;n.e.style.opacity=kk>0?.85*(1-P(kk,1.4,1.8)):0;tr(n.e,n.x+Math.sin(kk*3)*30,1500-kk*n.sp*2,1,Math.sin(kk*4)*15)});
  const a=ws(23)-.05;o.inf.style.opacity=P(t,a,a+.04);tr(o.inf,0,0,lerp(2.5,1,eExpo(P(t,a,a+.22)))*(1+.03*Math.sin(t*12)),lerp(-14,-4,eExpo(P(t,a,a+.22))));
});

// ===== 4 NETFLIX: "Netflix لأحسن الأفلام والمسلسلات" =====
scene(SG[4],SG[5],(el,o)=>{
  $(`<div class="full" style="background:radial-gradient(circle at 50% 40%,#3a0508 0%,#100203 50%,#000 85%)"></div>`,el);
